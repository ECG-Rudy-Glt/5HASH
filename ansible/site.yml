---
- name: Configurer les instances PrestaShop
  hosts: prestashop
  # Facts collectés dans pre_tasks, après l'installation de Python.
  gather_facts: false
  become: true

  vars:
    docker_install_compose_plugin: true
    # overlay2 et fuse-overlayfs échouent en Docker-in-Docker sur Floci.
    # Sur un vrai EC2, overlay2 suffit.
    docker_daemon_options:
      storage-driver: vfs

  pre_tasks:
    - name: Amorcer Python3 si absent
      ansible.builtin.raw: test -x /usr/bin/python3 || (apt-get update && apt-get install -y python3 && echo PYTHON_BOOTSTRAPPED)
      register: python_bootstrap
      changed_when: "'PYTHON_BOOTSTRAPPED' in python_bootstrap.stdout"

    - name: Collecter les facts
      ansible.builtin.setup:

  roles:
    - geerlingguy.docker # rôle Galaxy
    - prestashop
