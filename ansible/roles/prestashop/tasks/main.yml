---
- name: Créer le répertoire de l'application
  ansible.builtin.file:
    path: "{{ prestashop_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Lookup exécuté sur le contrôleur, pas sur l'instance.
- name: Lire les identifiants RDS dans Secrets Manager
  ansible.builtin.set_fact:
    prestashop_db_creds: "{{ lookup('amazon.aws.secretsmanager_secret', db_secret_arn,
                              region=prestashop_db_secret_region,
                              access_key=prestashop_floci_access_key,
                              secret_key=prestashop_floci_secret_key,
                              endpoint_url=prestashop_floci_endpoint) | from_json }}"
  no_log: true

- name: Déposer la config Apache forçant le header Host (contournement ALB Floci)
  ansible.builtin.template:
    src: force-host.conf.j2
    dest: "{{ prestashop_app_dir }}/force-host.conf"
    owner: root
    group: root
    mode: "0640"
  notify: Redéployer PrestaShop

- name: Déposer le docker-compose de PrestaShop
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ prestashop_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: Redéployer PrestaShop

# Rattrape un run précédent interrompu après le dépôt des templates : sans ce
# contrôle, le conteneur resterait absent. docker inspect évite le SDK Python.
- name: Vérifier que le conteneur PrestaShop tourne réellement
  ansible.builtin.command:
    cmd: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' {{ prestashop_app_dir | basename }}-prestashop-1
  register: prestashop_container_state
  changed_when: false
  failed_when: false

- name: Forcer le redéploiement si le conteneur est absent ou arrêté
  ansible.builtin.debug:
    msg: "Conteneur PrestaShop absent ou arrêté (probable échec transitoire au run précédent) — redéploiement forcé."
  changed_when: true
  when: prestashop_container_state.rc != 0 or prestashop_container_state.stdout | trim != 'true'
  notify: Redéployer PrestaShop

- name: Appliquer les redéploiements en attente
  ansible.builtin.meta: flush_handlers

# Le premier démarrage installe PrestaShop dans RDS : plusieurs minutes.
- name: Attendre que la boutique et le back-office répondent
  ansible.builtin.uri:
    url: "http://{{ private_ip }}:{{ prestashop_http_port }}{{ item }}"
    status_code: 200
  register: prestashop_http_check
  until: prestashop_http_check.status == 200
  retries: 90
  delay: 10
  loop:
    - /
    - "/{{ prestashop_admin_folder }}/"

- name: Afficher les URL de l'application
  ansible.builtin.debug:
    msg:
      - "Boutique     : http://{{ alb_dns_name }}/"
      - "Back-office  : http://{{ alb_dns_name }}/{{ prestashop_admin_folder }}/"
  run_once: true
