---
# Spécifique à Floci : chaque instance est un conteneur dont le port SSH est
# publié sur l'hôte. Sur un vrai AWS, ansible_host serait l'IP privée.
ansible_host: 127.0.0.1
ansible_port: >-
  {{ lookup('ansible.builtin.pipe', 'docker port floci-ec2-' ~ floci_instance ~ ' 22/tcp')
     | regex_search('[0-9]+$') }}
