[defaults]
# Auto-détecté par Ansible uniquement quand les commandes sont lancées depuis
# la racine du dépôt — c'est le cas de toute la séquence de test imposée par
# l'énoncé (ansible-galaxy/-inventory/-playbook ... ansible/...).
inventory        = ansible/inventory.yml
roles_path       = ansible/roles
collections_path = ansible/collections
host_key_checking = False
retry_files_enabled = False

[inventory]
# Un greffon d'inventaire doit être explicitement autorisé.
enable_plugins = cloud.terraform.terraform_provider

[ssh_connection]
# Les instances Floci sont des conteneurs éphémères : leur clé d'hôte change
# à chaque recréation. host_key_checking = False (ci-dessus) ignore les hôtes
# INCONNUS, mais refuse toujours un hôte CONNU dont la clé a changé — d'où
# UserKnownHostsFile=/dev/null, qui ne mémorise jamais aucune clé d'hôte.
# Sur un vrai AWS, avec des instances longue durée, on ne mettrait pas ceci :
# on voudrait au contraire détecter un changement de clé d'hôte suspect.
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s
